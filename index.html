<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกรายรับ-รายจ่าย</title>
<meta name="theme-color" content="#6E8368">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="update-banner" id="update-banner" hidden>
    <span>มีอัปเดตใหม่</span>
    <button type="button" id="update-reload-btn">รีเฟรช</button>
  </div>
  <header class="app-header">
    <h1>บันทึกรายรับ-รายจ่าย</h1>
  </header>

  <main>
    <section id="view-add" class="view">
      <form id="entry-form">
        <div class="tabs" id="type-tabs">
          <button type="button" data-type="expense" class="tab active">รายจ่าย</button>
          <button type="button" data-type="income" class="tab">รายรับ</button>
        </div>

        <div class="field amount-field">
          <label for="amount">จำนวนเงิน</label>
          <div class="amount-input">
            <span class="cur">฿</span>
            <input type="number" id="amount" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required>
          </div>
        </div>

        <div class="field">
          <label for="date">วันที่</label>
          <input type="date" id="date" required>
        </div>

        <div class="field" id="category-field">
          <label>หมวด</label>
          <div class="chips" id="category-chips"></div>
        </div>

        <div class="field" id="subcategory-field" hidden>
          <label>หมวดย่อย</label>
          <div class="subrow" id="subcategory-chips"></div>
        </div>

        <div class="field">
          <label for="note">โน้ต</label>
          <input type="text" id="note" placeholder="ไม่บังคับ" autocomplete="off">
        </div>

        <button type="submit" class="save-btn" id="save-btn">บันทึก</button>
        <button type="button" class="cancel-edit-btn" id="cancel-edit-btn" hidden>ยกเลิกการแก้ไข</button>
      </form>
      <p class="toast" id="toast" hidden>บันทึกแล้ว</p>
    </section>

    <div class="month-nav" id="month-nav" hidden>
      <button type="button" id="prev-month-btn" aria-label="เดือนก่อนหน้า">‹</button>
      <span id="month-label"></span>
      <button type="button" id="next-month-btn" aria-label="เดือนถัดไป">›</button>
    </div>

    <section id="view-overview" class="view" hidden>
      <div class="summary" id="overview-summary"></div>

      <div class="chart-card">
        <div class="chart-head">
          <span class="chart-title">แยกตามหมวด</span>
        </div>
        <div class="hbar-list" id="cat-chart"></div>
        <p class="empty" id="cat-chart-empty" hidden>ยังไม่มีรายจ่ายเดือนนี้</p>
      </div>

      <div class="chart-card">
        <div class="chart-head">
          <span class="chart-title">เทรนด์ 6 เดือน</span>
          <div class="chart-legend">
            <span class="legend-item"><i class="swatch income"></i>รายรับ</span>
            <span class="legend-item"><i class="swatch expense"></i>รายจ่าย</span>
          </div>
        </div>
        <div class="trend-plot" id="trend-plot"></div>
      </div>
    </section>

    <section id="view-history" class="view" hidden>
      <div class="summary" id="month-summary"></div>
      <div id="history-list"></div>
      <p class="empty" id="empty-state" hidden>ยังไม่มีรายการ</p>
      <div class="sync-bar">
        <span id="sync-status">ยังไม่ได้เชื่อม Google Sheets</span>
        <button type="button" id="sync-settings-btn">ตั้งค่า</button>
      </div>
      <div class="sheets-actions" id="sheets-actions" hidden>
        <button type="button" id="resync-btn">ซิงก์ทั้งหมดไป Sheets</button>
        <button type="button" id="restore-btn">กู้คืนจาก Sheets</button>
      </div>
      <div class="sync-bar" id="import-row">
        <span>นำเข้าข้อมูลเก่าจาก Spendee (1,553 รายการ)</span>
        <button type="button" id="import-spendee-btn">นำเข้า</button>
      </div>
    </section>

    <section id="view-recurring" class="view" hidden>
      <div id="recurring-main">
        <div class="due-card" id="due-card" hidden>
          <div class="chart-head"><span class="chart-title">ถึงรอบแล้ว · กรอกยอดจริง</span></div>
          <div id="due-list"></div>
        </div>
        <div class="summary" id="recurring-summary"></div>
        <div class="day-items" id="recurring-list"></div>
        <p class="empty" id="recurring-empty" hidden>ยังไม่มีรายการประจำ</p>
        <button type="button" class="save-btn add-recurring-btn" id="add-recurring-btn">+ เพิ่มรายการประจำ</button>
      </div>

      <form id="recurring-form" hidden>
        <div class="field">
          <label for="rc-name">ชื่อรายการ</label>
          <input type="text" id="rc-name" placeholder="เช่น Netflix" autocomplete="off">
        </div>
        <div class="field">
          <label for="rc-amount">จำนวนเงิน</label>
          <input type="number" id="rc-amount" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
        </div>
        <div class="field">
          <label>หมวด</label>
          <div class="chips" id="rc-category-chips"></div>
        </div>
        <div class="field" id="rc-subcategory-field" hidden>
          <label>หมวดย่อย</label>
          <div class="subrow" id="rc-subcategory-chips"></div>
        </div>
        <div class="field">
          <label>รอบ</label>
          <div class="seg" id="rc-cycle">
            <button type="button" data-value="monthly">รายเดือน</button>
            <button type="button" data-value="yearly">รายปี</button>
          </div>
        </div>
        <div class="field">
          <label for="rc-day">ตัดรอบ</label>
          <div class="rc-when">
            <span>วันที่</span>
            <input type="number" id="rc-day" min="1" max="31" inputmode="numeric">
            <span id="rc-month-wrap" hidden>เดือน <select id="rc-month"></select></span>
          </div>
        </div>
        <div class="field">
          <label>การบันทึก</label>
          <div class="seg" id="rc-mode">
            <button type="button" data-value="auto">บันทึกอัตโนมัติ</button>
            <button type="button" data-value="confirm">ยืนยันยอดก่อน</button>
          </div>
          <p class="hint" id="rc-mode-hint"></p>
        </div>
        <button type="submit" class="save-btn">บันทึก</button>
        <button type="button" class="cancel-edit-btn" id="rc-cancel-btn">ยกเลิก</button>
        <button type="button" class="danger-link" id="rc-delete-btn" hidden>ลบรายการประจำนี้</button>
      </form>
    </section>
  </main>

  <div class="chart-tooltip" id="chart-tooltip" hidden></div>

  <nav class="bottom-nav">
    <button type="button" class="nav-btn active" data-view="add">บันทึก</button>
    <button type="button" class="nav-btn" data-view="overview">ภาพรวม</button>
    <button type="button" class="nav-btn" data-view="history">ประวัติ</button>
    <button type="button" class="nav-btn" data-view="recurring">ประจำ<span class="nav-dot" id="recurring-dot" hidden></span></button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
